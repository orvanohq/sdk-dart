# Spec 0008 KIT-1: an SDK repo's CI, built from the core repo's reusable workflows.
# export-template.mjs fills in the language and pins a full commit SHA of orvanohq/orvano main (spec 0010 TPL-3).
# Move the pin forward with the core, and keep the date comment current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    uses: orvanohq/orvano/.github/workflows/repo-hygiene.yml@facb90bce597039dd15de0531b24216e3b0dea4b # main as of 2026-10-23
    permissions:
      contents: read
      pull-requests: read # the dco job reads the PR's commits (spec 0010 DCO-1)

  sdk:
    uses: orvanohq/orvano/.github/workflows/sdk-dart.yml@facb90bce597039dd15de0531b24216e3b0dea4b # main as of 2026-10-23
    permissions:
      contents: read

  # Spec 0014 RGN-3: regenerate from the pinned orvano commit and fail on any difference. The generator is Node, so
  # this job needs Node 24 and pnpm (RGN-2).
  drift:
    name: drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Enable pnpm through corepack (the orvano checkout pins its version)
        run: corepack enable
      - name: Cache the orvano checkout (RGN-2)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .orvano
          key: orvano-${{ hashFiles('orvano-contract.json') }}
      - run: dart pub get
      - name: Regenerate from the pin (checks the contract hash too)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: dart run tool/regenerate.dart
      - name: Generated code matches the pin
        run: git diff --exit-code

  # Spec 0014 CNF-5, CNF-6, spec 0004 DQA-3: every server scenario on the Dart VM, against Orvano and the stub from
  # api/conformance/compose.yaml at the pinned commit, using the published ghcr.io/orvanohq/orvano:sha-<pinned commit>
  # image.
  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Cache the orvano checkout (RGN-2)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .orvano
          key: orvano-${{ hashFiles('orvano-contract.json') }}
      - run: dart pub get
      - name: Fetch the pinned orvano commit
        run: dart run tool/regenerate.dart --fetch-only
      - name: Start Orvano, PostgreSQL, and the stub
        run: |
          ORVANO_IMAGE_TAG="sha-$(jq -r .commit orvano-contract.json)"
          export ORVANO_IMAGE_TAG
          echo "ORVANO_IMAGE_TAG=$ORVANO_IMAGE_TAG" >> "$GITHUB_ENV"
          docker compose --file .orvano/api/conformance/compose.yaml up --detach --wait
      - name: Conformance (Dart VM)
        run: dart test --tags conformance
      - name: Server logs
        if: failure()
        run: docker compose --file .orvano/api/conformance/compose.yaml logs --no-color

  ci-gate:
    name: ci-gate
    if: always()
    needs: [hygiene, sdk, drift, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")'
